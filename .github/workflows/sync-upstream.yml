name: Sync upstream main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-upstream.yml
      - scripts/sync_upstream.py
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-main-pushed]

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - name: Configure merge author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Check upstream every minute
        shell: python
        run: |
          import subprocess
          import time

          # Keep polling through scheduler delays. Scheduled starts queue one
          # replacement run behind this one via the concurrency group.
          for attempt in range(55):
              started = time.monotonic()
              print(f"Upstream check {attempt + 1}/55", flush=True)
              subprocess.run(["python3", "scripts/sync_upstream.py", "--push"], check=True)
              if attempt < 54:
                  time.sleep(max(0, 60 - (time.monotonic() - started)))
