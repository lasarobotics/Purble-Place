# HazeHub full stack: MongoDB + FastAPI + Next.js.
#
#   docker compose up --build
#   web  -> http://localhost:3000
#   api  -> http://localhost:8000  (docs at /docs)

services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: hazehub
      MONGO_INITDB_ROOT_PASSWORD: hazehub_dev_password
    volumes:
      - hazehub_mongodb:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - hazehub
        - --password
        - hazehub_dev_password
        - --authenticationDatabase
        - admin
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://hazehub:hazehub_dev_password@mongodb:27017/?authSource=admin
      MONGODB_DATABASE: hazehub
      HAZEHUB_TEAM_PASSWORD: HazeRain!
      HAZEHUB_SECRET: change-me-in-production
      HAZEHUB_SEASON: "2026"
      HAZEHUB_HOME_TEAMS: "418,436"
      # HAZEHUB_CORS: https://your-web-host
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # Inlined at build time — the browser calls this URL directly.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  hazehub_mongodb:
