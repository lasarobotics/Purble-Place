# MegaScout — on-prem event server (the Strategy Router "MegaScout Setup").
#
#   Nginx (TLS reverse proxy)  ─┬─ /            → web  (Next.js PWA)
#                               ├─ /api, /docs  → api  (FastAPI)
#                               └─ /ws          → api  (WebSocket hub)
#   api      ── FastAPI, commits scouting + writes the Azure outbox row atomically
#   worker   ── drains the outbox to Azure (durable, idempotent, retries forever)
#   postgres ── primary store; NOT published to the host's external interfaces
#   backup   ── periodic pg_dump to the backups volume
#
# Bring up:   docker compose --env-file .env up -d --build
# Sign in at  https://<megascout-host>/  (or http://<host>/ before TLS certs).

name: megascout

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haze}
      POSTGRES_DB: ${POSTGRES_DB:-hazehub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Restricted to the compose network. Uncomment to also reach it from the
    # MegaScout host only (never 0.0.0.0):
    #   ports: ["127.0.0.1:5432:5432"]
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haze} -d ${POSTGRES_DB:-hazehub}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-haze}:${POSTGRES_PASSWORD:-haze}@postgres:5432/${POSTGRES_DB:-hazehub}
      HAZEHUB_TEAM_PASSWORD: ${HAZEHUB_TEAM_PASSWORD:-HazeRain!}
      HAZEHUB_SECRET: ${HAZEHUB_SECRET:-change-me-in-production}
      HAZEHUB_ADMIN_ID: ${HAZEHUB_ADMIN_ID:-admin}
      HAZEHUB_SEASON: ${HAZEHUB_SEASON:-2026}
      TBA_AUTH_KEY: ${TBA_AUTH_KEY:-}
      MEGASCOUT: "1"
      # Azure sync (leave blank to run local-only; outbox stays durable).
      CLOUD_SYNC_URL: ${CLOUD_SYNC_URL:-}
      CLOUD_SYNC_KEY: ${CLOUD_SYNC_KEY:-}
      # Optional UniFi/gateway stats API for the System Health network panel.
      HAZEHUB_GATEWAY_STATS_URL: ${HAZEHUB_GATEWAY_STATS_URL:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.sync_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-haze}:${POSTGRES_PASSWORD:-haze}@postgres:5432/${POSTGRES_DB:-hazehub}
      MEGASCOUT: "1"
      CLOUD_SYNC_URL: ${CLOUD_SYNC_URL:-}
      CLOUD_SYNC_KEY: ${CLOUD_SYNC_KEY:-}
      HAZEHUB_SYNC_INTERVAL: ${HAZEHUB_SYNC_INTERVAL:-5}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      args:
        # Empty → the browser calls the API same-origin through Nginx (no CORS).
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGUSER: ${POSTGRES_USER:-haze}
      PGPASSWORD: ${POSTGRES_PASSWORD:-haze}
      PGDATABASE: ${POSTGRES_DB:-hazehub}
      PGHOST: postgres
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-48}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  backups:
