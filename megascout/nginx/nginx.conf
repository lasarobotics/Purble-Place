# MegaScout reverse proxy.
#   /            → web  (Next.js)
#   /api, /docs  → api  (FastAPI)
#   /ws          → api  (WebSocket hub — needs the Upgrade headers below)
#
# Ships working on HTTP :80. To enable TLS (recommended on the event LAN),
# drop fullchain.pem + privkey.pem into ./nginx/certs and uncomment the 443
# server block + the HTTP→HTTPS redirect.

upstream megascout_api { server api:8000; }
upstream megascout_web { server web:3000; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;   # robot photos / heatmaps can be chunky

    # --- To force HTTPS once certs are in place, replace this block's body with:
    # return 301 https://$host$request_uri;

    location /ws {
        proxy_pass http://megascout_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    location ~ ^/(api|docs|openapi.json|redoc|field) {
        proxy_pass http://megascout_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://megascout_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

