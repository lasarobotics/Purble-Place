# Local Firestore for development, without installing the Firebase CLI or a
# JDK on the host.
#
#   docker compose up -d
#   # then, in backend/.env or your shell:
#   FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
#
# Emulator UI: http://localhost:4000
#
# Data lives in ./data/emulator and is exported on shutdown, so a restart
# keeps your test event.

services:
  firestore:
    image: node:20-slim
    working_dir: /work
    ports:
      - "8080:8080"   # Firestore
      - "4000:4000"   # Emulator UI
      - "4400:4400"   # Emulator hub
      - "9150:9150"   # UI websocket
    volumes:
      - ./data/emulator:/work/data
    environment:
      # firebase-tools 14+ requires JDK 21; the emulator itself needs a JRE.
      DEBIAN_FRONTEND: noninteractive
    command: >
      bash -lc "
        apt-get update -qq && apt-get install -y -qq openjdk-21-jre-headless >/dev/null &&
        npm install -g firebase-tools >/dev/null &&
        firebase emulators:start
          --only firestore
          --project hazehub-local
          --import ./data --export-on-exit ./data
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
